name: Integração Continua

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório.
        uses: actions/checkout@v4
      - name: Instalar o Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias do package-lock.json
        run: npm ci
      - name: Gerar prisma client
        run: npx prisma generate
      - name: Verificar TypeScript
        run: npm run check
      - name: Verificar tipagem dos testes
        run: npm run check:test
      - name: Executar testes
        run: npm test
      - name: Compilar aplicação
        run: npm run build
    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test_db"
      JWT_SECRET: "ci-only-secret-not-for-production"
